name: Build and Test

on:
  push:
    branches:
    - main
    - master
    - release/**
  pull_request:
    branches:
    - main
    - master
    - release/**
  workflow_dispatch:

env:
  NODE_VERSION: ${{ vars.NODE_VERSION && vars.NODE_VERSION || '20' }}
  REGISTRY: https://npm.pkg.github.com
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@v3

    - name: "Install dependencies and run tests"
      uses: StudioWhyNot/act/common/npm/npm-test@master
      with:
        nodeVersion: ${{ env.NODE_VERSION }}
        testCommand: npm run test:coverage
        uploadCoverage: true
        authUrls: ${{ env.REGISTRY }}
        apiKeys: ${{ env.NODE_AUTH_TOKEN }}
